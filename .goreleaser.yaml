version: 2

builds:
  - id: rest-o-matic
    main: ./cmd/rest-o-matic
    binary: rest-o-matic
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

release:
  # GoReleaser does NOT detect a tag's semver pre-release suffix (e.g.
  # -rc.1) automatically - prerelease defaults to false. "auto" is required
  # for a hyphenated tag to actually be marked as a pre-release on GitHub.
  prerelease: auto

changelog:
  sort: asc
  groups:
    - title: "Features"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: "Others"
      order: 999
