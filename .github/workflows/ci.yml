name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install restic
        # Several test suites (internal/execution, cmd/rest-o-matic) skip
        # their integration tests when restic isn't on PATH - install it so
        # this check actually exercises that coverage instead of silently
        # skipping most of it.
        run: sudo apt-get update && sudo apt-get install -y restic

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
